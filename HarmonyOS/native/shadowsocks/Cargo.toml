[package]
name = "futurefast-ss"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
shadowsocks-service = { version = "=1.25.0", default-features = false, features = ["local", "aead-cipher"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
shadowsocks-service = { version = "=1.25.0", default-features = false, features = ["server"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
panic = "abort"

[workspace]
