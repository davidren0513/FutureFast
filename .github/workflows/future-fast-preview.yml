name: Future Fast Preview APK

on:
  push:
    branches: [master, feature/future-fast-preview, fix/liquid-glass-fidelity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: future-fast-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check patch whitespace
        run: |
          git remote add upstream https://github.com/2dust/v2rayNG.git
          test "$(git remote get-url upstream)" = https://github.com/2dust/v2rayNG.git
          git fetch upstream master
          test -z "$(git diff --name-only upstream/master -- ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' ':(glob)**/GEMINI.md' .github/copilot-instructions.md)"
          test -z "$(git diff --cached --name-only -- ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' ':(glob)**/GEMINI.md' .github/copilot-instructions.md)"
          test -z "$(git diff --name-only upstream/master...HEAD -- ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' ':(glob)**/GEMINI.md' .github/copilot-instructions.md)"
          git diff --check 118cf5bc7d0b290947b0827f5ad03e73018d8e5d HEAD -- . ':!docs/UPSTREAM_README.md'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - name: Install NDK and build HEV inputs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install 'ndk;30.0.16248370' > /dev/null || test -d "$ANDROID_HOME/ndk/30.0.16248370"
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
      - name: Resolve exact native-core release tag
        run: |
          expected=$(git ls-tree HEAD AndroidLibXrayLite | awk '{print $3}')
          actual=$(git -C AndroidLibXrayLite rev-parse HEAD)
          test "$expected" = "$actual"
          tag=$(git -C AndroidLibXrayLite describe --tags --exact-match HEAD)
          echo "XRAY_TAG=$tag" >> "$GITHUB_ENV"
      - name: Download pinned native-core AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache preview signing identity
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: future-fast-preview-debug-keystore-v1
      - name: Test and assemble installable debug APKs
        working-directory: V2rayNG
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --tests com.v2ray.ang.dto.FutureFastPolicyTest
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug :app:assembleFdroidDebug
      - name: Lint visual changes
        working-directory: V2rayNG
        run: ./gradlew :app:lintPlaystoreDebug :app:lintFdroidDebug
      - name: Verify packaged native libraries and create checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          files = sorted(Path('V2rayNG/app/build/outputs/apk').rglob('*.apk'))
          assert files, 'No APKs produced'
          lines = []
          for path in files:
              with zipfile.ZipFile(path) as apk:
                  entries = set(apk.namelist())
                  abis = {name.split('/')[1] for name in entries if name.startswith('lib/') and name.endswith('/libgojni.so')}
                  assert abis, f'Missing Xray JNI: {path}'
                  for abi in abis:
                      for library in ('libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so'):
                          assert f'lib/{abi}/{library}' in entries, f'{path}: {abi}/{library} missing'
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          Path('SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Upload ARM64 phone APK
        uses: actions/upload-artifact@v7
        with:
          name: FutureFast-0.4.3-arm64
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FutureFast-test-reports
          path: |
            V2rayNG/app/build/reports/tests
            V2rayNG/app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install V2rayNG/app/build/outputs/apk/playstore/debug/*x86_64*.apk
            adb shell pm grant tech.future.fast android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -W -n tech.future.fast/com.v2ray.ang.ui.main.MainActivity
            sleep 8
            adb shell pidof tech.future.fast
            mkdir -p smoke
            python3 tools/capture-future-fast.py
            adb logcat -b crash -d > smoke/crash.log
            test ! -s smoke/crash.log || ! grep -q 'FATAL EXCEPTION' smoke/crash.log
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FutureFast-emulator-smoke
          path: smoke/
          if-no-files-found: ignore
